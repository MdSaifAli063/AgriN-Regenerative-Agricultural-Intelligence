apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: agrin-api-servicemonitor
  namespace: agrin-node
  labels:
    release: prometheus
    app.kubernetes.io/component: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: agrin-postgres-servicemonitor
  namespace: agrin-node
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: agrin-postgres
  endpoints:
    - port: metrics
      interval: 15s
