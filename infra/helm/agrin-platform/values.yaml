# Default values for agrin-platform umbrella chart
global:
  environment: demo
  demoMode: true
  devAuthBypass: true

agrin-node:
  enabled: true
  node:
    id: "node-demo-all-in-one"
    countryIso: "IND"
    registryUrl: "http://brics-registry:8001"
    messagingProvider: "simulator"
    demoMode: true
  api:
    replicaCount: 1
    autoscaling:
      enabled: false
  worker:
    replicaCount: 1
    autoscaling:
      enabled: false
  beat:
    replicaCount: 1
  web:
    replicaCount: 1
    autoscaling:
      enabled: false

brics-registry:
  enabled: true
  replicaCount: 1
