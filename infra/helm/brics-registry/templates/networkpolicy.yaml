{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "brics-registry.fullname" . }}-perimeter
  labels:
    app.kubernetes.io/name: {{ include "brics-registry.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: commons-registry
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "brics-registry.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Ingress from Ingress Controller or external API gateways
    - ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
  egress:
    # Cluster DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
