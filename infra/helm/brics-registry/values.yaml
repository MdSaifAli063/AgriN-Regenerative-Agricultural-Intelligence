replicaCount: 2

image:
  repository: ghcr.io/krishinet/brics-registry
  pullPolicy: IfNotPresent
  tag: "1.0.0"

service:
  type: ClusterIP
  port: 8010
  targetPort: 8010

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: commons.krishinet.org
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 512Mi

networkPolicy:
  enabled: true
