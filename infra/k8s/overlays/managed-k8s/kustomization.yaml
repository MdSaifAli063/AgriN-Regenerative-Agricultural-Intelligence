apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../cloudnative-pg-cluster.yaml
  - ../../redis.yaml
  - ../../minio.yaml
  - ../../external-secrets.yaml

namespace: agrin-node

patches:
  - target:
      kind: StatefulSet
      name: minio
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: "gp3" # EKS / GKE standard-rwo / AKS managed-csi
  - target:
      kind: StatefulSet
      name: redis-queue
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: "gp3"
