apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agrin-k3s-ingress
  namespace: agrin-node
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: agrin-node-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agrin-node-web
                port:
                  number: 3000
