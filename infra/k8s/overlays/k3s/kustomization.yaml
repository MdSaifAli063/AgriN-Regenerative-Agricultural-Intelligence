apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../redis.yaml
  - ../../minio.yaml
  - traefik-ingress.yaml

namespace: agrin-node

patches:
  - target:
      kind: StatefulSet
      name: minio
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: "local-path"
  - target:
      kind: StatefulSet
      name: redis-queue
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: "local-path"
