# ==============================================================================
# Sovereign Node Secrets Management: External Secrets Operator & Sealed Secrets
# Guarantees zero plaintext secrets in Helm values or Git repositories.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. ClusterSecretStore: Connects to Cloud KMS / HashiCorp Vault / Azure KeyVault
# ------------------------------------------------------------------------------
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: sovereign-vault-store
spec:
  provider:
    vault:
      server: "https://vault.krishinet.brics.agri:8200"
      path: "sovereign-nodes"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "agrin-node-role"
---

# ------------------------------------------------------------------------------
# 2. ExternalSecret: Application Secrets & Third-Party Gateways
# ------------------------------------------------------------------------------
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agrin-app-secrets
  namespace: agrin-node
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: sovereign-vault-store
    kind: ClusterSecretStore
  target:
    name: agrin-app-credentials
    creationPolicy: Owner
  data:
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: node/credentials
        property: gemini_api_key

    - secretKey: TWILIO_AUTH_TOKEN
      remoteRef:
        key: node/messaging
        property: twilio_auth_token

    - secretKey: META_APP_SECRET
      remoteRef:
        key: node/messaging
        property: meta_app_secret

    - secretKey: KEYCLOAK_CLIENT_SECRET
      remoteRef:
        key: node/auth
        property: keycloak_secret

    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: node/auth
        property: jwt_secret_key

    - secretKey: MESSAGING_ENCRYPTION_KEY
      remoteRef:
        key: node/messaging
        property: encryption_key
---

# ------------------------------------------------------------------------------
# 3. ExternalSecret: Node Ed25519 Cryptographic Federation Identity
# (Mounted as a read-only volume in API/Federation pods, never injected as env)
# ------------------------------------------------------------------------------
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: node-ed25519-identity-secret
  namespace: agrin-node
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: sovereign-vault-store
    kind: ClusterSecretStore
  target:
    name: node-ed25519-identity
    creationPolicy: Owner
  data:
    - secretKey: node_private.key
      remoteRef:
        key: node/federation
        property: ed25519_private_key
    - secretKey: node_public.pub
      remoteRef:
        key: node/federation
        property: ed25519_public_key
---

