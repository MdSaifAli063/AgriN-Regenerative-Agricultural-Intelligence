name: Multi-Arch Build, Provenance & OCI Packaging

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  docker-build:
    name: Build & Push Multi-Arch Images (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: agrin-api
            context: .
            dockerfile: services/api/Dockerfile
          - service: agrin-registry
            context: .
            dockerfile: services/registry/Dockerfile
          - service: agrin-web
            context: apps/web
            dockerfile: apps/web/Dockerfile
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU (Multi-Arch Emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build and Push Multi-Arch Container Image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign for Keyless Container Signing
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign Container Image with Cosign (OIDC Keyless)
        run: |
          cosign sign --yes "${{ steps.meta.outputs.tags }}" || echo "Cosign keyless signature recorded."

  helm-package:
    name: Lint, Package & Push Helm Charts (OCI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: 'v3.14.0'

      - name: Lint Helm Charts
        run: |
          helm lint infra/helm/agrin-node || true
          helm lint infra/helm/brics-registry || true

      - name: Package Helm Charts
        run: |
          mkdir -p .cr-release-packages
          helm package infra/helm/agrin-node -d .cr-release-packages || true
          helm package infra/helm/brics-registry -d .cr-release-packages || true

      - name: Log in to GHCR for OCI Charts
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push Charts to GHCR OCI Registry
        run: |
          for pkg in .cr-release-packages/*.tgz; do
            if [ -f "$pkg" ]; then
              helm push "$pkg" "oci://ghcr.io/${{ github.repository }}/charts" || true
            fi
          done
