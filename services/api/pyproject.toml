[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "krishinet-api"
version = "1.0.0"
description = "KrishiNet-BRICS (AgriN Commons) Sovereign Node API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "email-validator>=2.2.0",
    "sqlalchemy>=2.0.32",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.3",
    "geoalchemy2>=0.15.2",
    "pgvector>=0.3.2",
    "alembic>=1.13.2",
    "redis>=5.0.8",
    "celery>=5.4.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1",
    "httpx>=0.27.0",
    "shapely>=2.0.5",
    "pyproj>=3.6.1",
    "numpy>=1.26.4",
    "minio>=7.2.8",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.9",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.26.0",
    "opentelemetry-sdk>=1.26.0",
    "opentelemetry-instrumentation-fastapi>=0.47b0",
    "pystac-client>=0.8.2",
    "rasterio>=1.3.10",
    "pillow>=10.4.0",
    "matplotlib>=3.9.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.2",
    "mypy>=1.11.1",
    "testcontainers[postgres]>=4.8.1",
    "schemathesis>=3.28.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*:",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]

[tool.coverage.run]
source = ["src/app"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/alembic/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "W"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "app.messaging.*",
    "app.ai.*",
    "app.core.security.*"
]
disallow_untyped_defs = true
strict = true
