[project]
name = "agrin-registry"
version = "1.0.0"
description = "BRICS Commons Sovereign Registry Service"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.6",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.32",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "cryptography>=43.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["src"]
testpaths = ["src/registry/tests"]

[tool.coverage.run]
source = ["src/registry"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
check_untyped_defs = true
